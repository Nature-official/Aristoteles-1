<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aristoteles Research System</title>

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background-image:url("desktop-background.png.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    font-family:Arial, Helvetica, sans-serif;
}

/* Battery indicator */

#status{
    position:absolute;
    top:25px;
    left:30px;
}

.battery{
    width:42px;
    height:20px;
    border:2px solid #333;
    border-radius:4px;
    position:relative;
}

.battery::after{
    content:"";
    position:absolute;
    right:-6px;
    top:5px;
    width:4px;
    height:8px;
    background:#333;
    border-radius:1px;
}

.battery-level{
    position:absolute;
    top:3px;
    left:3px;
    width:32px;
    height:10px;
    background:#333;
    border-radius:1px;
}

</style>

</head>

<body>

<div id="status">
    <div class="battery">
        <div class="battery-level"></div>
    </div>
</div>

</body>

</html>
