<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aristoteles Research System</title>

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background-image:url("desktop-background.png.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    font-family:Arial, Helvetica, sans-serif;
}

/* Battery indicator */

#status{
    position:absolute;
    top:25px;
    left:30px;
}

.battery{
    width:42px;
    height:20px;
    border:2px solid #333;
    border-radius:4px;
    position:relative;
}

.battery::after{
    content:"";
    position:absolute;
    right:-6px;
    top:5px;
    width:4px;
    height:8px;
    background:#333;
    border-radius:1px;
}

.battery-level{
    position:absolute;
    top:3px;
    left:3px;
    width:32px;
    height:10px;
    background:#333;
    border-radius:1px;
}

/* =========================
   QPR-001G GRAPH WINDOW
   ========================= */

.graph-window {
    position: absolute;

    /* Position on the desktop */
    bottom: 40px;
    left: 40px;

    width: 820px;
    height: 390px;

    background: #000;

    border: 1px solid #999;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);

    z-index: 9999;
}


/* WHITE BAR AT THE TOP */

.graph-titlebar {
    height: 42px;

    background: white;

    color: #111;

    display: flex;
    align-items: center;

    padding-left: 18px;

    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 500;

    border-bottom: 1px solid #aaa;

    box-sizing: border-box;
}


/* BLACK GRAPH AREA */

.graph-content {
    width: 100%;
    height: calc(100% - 42px);

    background: black;

    overflow: hidden;
}


#qprGraph {
    width: 100%;
    height: 100%;

    display: block;

    background: black;
}
    
</style>

</head>

<body>

<div id="status">
    <div class="battery">
        <div class="battery-level"></div>
    </div>
</div>

    <!-- QPR-001G GRAPH WINDOW -->
<div class="graph-window" id="qprWindow">

    <div class="graph-titlebar">
        <span>QPR-001G</span>
    </div>

    <div class="graph-content">
        <canvas id="qprGraph"></canvas>
    </div>

</div>

<script>

const canvas = document.getElementById("qprGraph");
const ctx = canvas.getContext("2d");


/* =========================
   GRAPH SETTINGS
   ========================= */

const COLS = 70;
const ROWS = 27;

let cellWidth;
let cellHeight;


/* =========================
   QPR-001G SEQUENCE
   ========================= */

/*
The graph begins at height 7.

The following numbers are the major
destinations described in your sequence.
The program automatically creates the
diagonal movement between them.
*/

const destinations = [

    7,

    22,
    23,
    3,
    19,
    7,
    23,
    13,
    5,
    7,
    4,
    18,
    24,
    5,
    22,
    23,
    4,
    12,
    6,
    23,
    4,
    3,
    18,
    7,
    4,
    11,
    7,
    6,
    7,
    25,
    4,
    21,
    16,
    10,
    7,
    23,
    13,
    6,
    23,
    7,
    4,
    22,
    7,
    16,
    3,
    22,
    23

];


/* =========================
   BUILD THE COMPLETE
   REPEATING SEQUENCE
   ========================= */

let sequence = [];


/*
First point: height 7.
*/

sequence.push(7);


/*
This function moves diagonally between
two heights, one row at a time.
*/

function moveToHeight(from, to) {

    let current = from;

    const direction = to > from ? 1 : -1;

    while (current !== to) {

        current += direction;

        sequence.push(current);

    }

}


/*
Build the entire graph pattern.

After every destination is reached,
it stays there for two additional
horizontal cubes.
*/

for (let i = 1; i < destinations.length; i++) {

    const previous = destinations[i - 1];
    const target = destinations[i];

    moveToHeight(previous, target);

    sequence.push(target);
    sequence.push(target);

}


/* =========================
   LIVE GRAPH DATA
   ========================= */

let graphOffset = 0;


/*
Returns the height for any position.

The modulo (%) means that after the
entire sequence ends, it starts again
from the beginning forever.
*/

function getHeight(index) {

    const sequenceIndex =
        ((index % sequence.length) + sequence.length)
        % sequence.length;

    return sequence[sequenceIndex];

}


/* =========================
   RESIZE CANVAS
   ========================= */

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );

    cellWidth = rect.width / COLS;
    cellHeight = rect.height / ROWS;

}


/* =========================
   DRAW GRAPH
   ========================= */

function drawGraph() {

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;


    /* BLACK BACKGROUND */

    ctx.clearRect(0, 0, width, height);

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* =========================
       DRAW 70 × 27 GRID
       ========================= */

    ctx.strokeStyle = "#1a1a1a";

    ctx.lineWidth = 1;


    /* Vertical lines */

    for (let x = 0; x <= COLS; x++) {

        const positionX =
            x * cellWidth;

        ctx.beginPath();

        ctx.moveTo(positionX, 0);

        ctx.lineTo(
            positionX,
            height
        );

        ctx.stroke();

    }


    /* Horizontal lines */

    for (let y = 0; y <= ROWS; y++) {

        const positionY =
            y * cellHeight;

        ctx.beginPath();

        ctx.moveTo(0, positionY);

        ctx.lineTo(
            width,
            positionY
        );

        ctx.stroke();

    }


    /* =========================
       DRAW GREEN QPR LINE
       ========================= */

    ctx.strokeStyle = "#39ff88";

    ctx.lineWidth = 1.5;

    ctx.shadowColor = "#39ff88";

    ctx.shadowBlur = 4;


    ctx.beginPath();


    for (let column = 0; column < COLS; column++) {

        const heightValue =
            getHeight(graphOffset + column);


        /*
        Convert graph height into
        a vertical canvas position.

        Height 1 = top
        Height 27 = bottom
        */

        const row =
            heightValue - 1;


        const x =
            column * cellWidth
            + cellWidth / 2;


        const y =
            row * cellHeight
            + cellHeight / 2;


        if (column === 0) {

            ctx.moveTo(x, y);

        } else {

            ctx.lineTo(x, y);

        }

    }


    ctx.stroke();


    ctx.shadowBlur = 0;

}


/* =========================
   ANIMATE GRAPH
   ========================= */

let lastUpdate = 0;


/*
One new cube every 350 milliseconds.

You can change this number later
to make the graph faster or slower.
*/

const UPDATE_SPEED = 350;


function animate(timestamp) {

    if (
        timestamp - lastUpdate
        >= UPDATE_SPEED
    ) {

        graphOffset++;

        lastUpdate = timestamp;

    }


    drawGraph();

    requestAnimationFrame(animate);

}


/* =========================
   START GRAPH
   ========================= */

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

requestAnimationFrame(animate);

</script>
    
</body>

</html>
