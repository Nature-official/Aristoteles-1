<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aristoteles Research System</title>

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background-image:url("desktop-background.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   BATTERY INDICATOR
   ========================= */

#status{
    position:absolute;
    top:25px;
    left:30px;
}

.battery{
    width:42px;
    height:20px;
    border:2px solid #333;
    border-radius:4px;
    position:relative;
}

.battery::after{
    content:"";
    position:absolute;
    right:-6px;
    top:5px;
    width:4px;
    height:8px;
    background:#333;
    border-radius:1px;
}

.battery-level{
    position:absolute;
    top:3px;
    left:3px;
    width:32px;
    height:10px;
    background:#333;
    border-radius:1px;
}


/* =========================
   DESKTOP FOLDERS
   ========================= */

.folder{
    position:absolute;

    width:90px;

    display:flex;
    flex-direction:column;
    align-items:center;

    cursor:pointer;
    user-select:none;

    z-index:5;
}

.folder-icon{
    width:58px;
    height:44px;

    background:#d6d6d6;

    border:1px solid #999;

    border-radius:3px;

    position:relative;
}

/* Folder tab */

.folder-icon::before{
    content:"";

    position:absolute;

    top:-7px;
    left:4px;

    width:24px;
    height:8px;

    background:#d6d6d6;

    border:1px solid #999;

    border-bottom:none;

    border-radius:3px 3px 0 0;
}

.folder-name{
    margin-top:8px;

    font-size:13px;

    color:#222;

    text-align:center;

    padding:3px 6px;

    background:rgba(255,255,255,0.6);
}


/* FOLDER POSITIONS */

#folder1{
    top:170px;
    left:40px;
}

#folder2{
    top:280px;
    left:40px;
}

#folder3{
    top:390px;
    left:40px;
}


/* =========================
   QPR-001G GRAPH WINDOW
   ========================= */

.graph-window{
    position:absolute;

    bottom:40px;
    left:40px;

    width:820px;
    height:390px;

    background:#000;

    border:1px solid #999;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);

    z-index:10;
}

.graph-titlebar{
    height:42px;

    background:white;

    color:#111;

    display:flex;
    align-items:center;

    padding-left:18px;

    font-size:15px;
    font-weight:500;

    border-bottom:1px solid #aaa;
}

.graph-content{
    width:100%;
    height:calc(100% - 42px);

    background:black;

    overflow:hidden;
}

#qprGraph{
    width:100%;
    height:100%;

    display:block;

    background:black;
}


/* =========================
   QPR-001TI WINDOW
   ========================= */

.ti-window{
    position:fixed;

    top:50%;
    right:70px;

    transform:translateY(-50%);

    width:560px;
    height:300px;

    background:#111;

    border:1px solid #999;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);

    z-index:20;
}

.ti-titlebar{
    height:42px;

    background:white;

    color:#111;

    display:flex;
    align-items:center;

    padding-left:18px;

    font-size:15px;
    font-weight:500;

    border-bottom:1px solid #aaa;
}

.ti-content{
    width:100%;
    height:calc(100% - 42px);

    background:#111;

    overflow:hidden;
}

#tiCanvas{
    width:100%;
    height:100%;

    display:block;

    image-rendering:pixelated;

    background:#111;
}

</style>

</head>


<body>


<!-- BATTERY -->

<div id="status">
    <div class="battery">
        <div class="battery-level"></div>
    </div>
</div>


<!-- =========================
     DESKTOP FOLDERS
     ========================= -->

<div class="folder" id="folder1">
    <div class="folder-icon"></div>
    <div class="folder-name">Folder 01</div>
</div>

<div class="folder" id="folder2">
    <div class="folder-icon"></div>
    <div class="folder-name">Folder 02</div>
</div>

<div class="folder" id="folder3">
    <div class="folder-icon"></div>
    <div class="folder-name">Folder 03</div>
</div>


<!-- =========================
     QPR-001G GRAPH WINDOW
     ========================= -->

<div class="graph-window" id="qprWindow">

    <div class="graph-titlebar">
        <span>QPR-001G</span>
    </div>

    <div class="graph-content">
        <canvas id="qprGraph"></canvas>
    </div>

</div>


<!-- =========================
     QPR-001TI WINDOW
     ========================= -->

<div class="ti-window" id="tiWindow">

    <div class="ti-titlebar">
        <span>QPR-001TI</span>
    </div>

    <div class="ti-content">
        <canvas id="tiCanvas"></canvas>
    </div>

</div>


<script>

/* =========================
   QPR-001G GRAPH
   ========================= */

const canvas = document.getElementById("qprGraph");
const ctx = canvas.getContext("2d");

const COLS = 70;
const ROWS = 27;

let cellWidth;
let cellHeight;


/* QPR-001G SEQUENCE */

const destinations = [

    7,

    22,
    23,
    3,
    19,
    7,
    23,
    13,
    5,
    7,
    4,
    18,
    24,
    5,
    22,
    23,
    4,
    12,
    6,
    23,
    4,
    3,
    18,
    7,
    3,
    11,
    7,
    6,
    7,
    25,
    3,
    21,
    16,
    10,
    7,
    23,
    13,
    6,
    23,
    7,
    4,
    22,
    7,
    16,
    3,
    22,
    23

];

let sequence = [];

sequence.push(7);


function moveToHeight(from, to){

    let current = from;

    const direction =
        to > from ? 1 : -1;

    while(current !== to){

        current += direction;

        sequence.push(current);

    }

}


for(let i = 1; i < destinations.length; i++){

    const previous =
        destinations[i - 1];

    const target =
        destinations[i];

    moveToHeight(previous, target);

    sequence.push(target);
    sequence.push(target);

}


let graphOffset = 0;


function getHeight(index){

    const sequenceIndex =
        ((index % sequence.length)
        + sequence.length)
        % sequence.length;

    return sequence[sequenceIndex];

}


function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    canvas.width =
        rect.width * window.devicePixelRatio;

    canvas.height =
        rect.height * window.devicePixelRatio;

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );

    cellWidth =
        rect.width / COLS;

    cellHeight =
        rect.height / ROWS;

}


function drawGraph(){

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* GRID */

    ctx.strokeStyle = "#1a1a1a";

    ctx.lineWidth = 1;


    for(let x = 0; x <= COLS; x++){

        const positionX =
            x * cellWidth;

        ctx.beginPath();

        ctx.moveTo(positionX, 0);

        ctx.lineTo(
            positionX,
            height
        );

        ctx.stroke();

    }


    for(let y = 0; y <= ROWS; y++){

        const positionY =
            y * cellHeight;

        ctx.beginPath();

        ctx.moveTo(0, positionY);

        ctx.lineTo(
            width,
            positionY
        );

        ctx.stroke();

    }


    /* GREEN GRAPH LINE */

    ctx.strokeStyle = "#39ff88";

    ctx.lineWidth = 1.5;

    ctx.shadowColor = "#39ff88";

    ctx.shadowBlur = 4;

    ctx.beginPath();


    for(
        let column = 0;
        column < COLS;
        column++
    ){

        const heightValue =
            getHeight(
                graphOffset + column
            );

        const row =
            heightValue - 1;

        const x =
            column * cellWidth
            + cellWidth / 2;

        const y =
            row * cellHeight
            + cellHeight / 2;


        if(column === 0){

            ctx.moveTo(x, y);

        }else{

            ctx.lineTo(x, y);

        }

    }


    ctx.stroke();

    ctx.shadowBlur = 0;

}


let lastUpdate = 0;

const UPDATE_SPEED = 350;


function animate(timestamp){

    if(
        timestamp - lastUpdate
        >= UPDATE_SPEED
    ){

        graphOffset++;

        lastUpdate = timestamp;

    }

    drawGraph();

    requestAnimationFrame(animate);

}


resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

requestAnimationFrame(animate);



/* =========================
   QPR-001TI IMAGE
   ========================= */

const tiCanvas =
    document.getElementById("tiCanvas");

const tiCtx =
    tiCanvas.getContext("2d");


function resizeTICanvas(){

    const rect =
        tiCanvas.getBoundingClientRect();

    tiCanvas.width =
        rect.width;

    tiCanvas.height =
        rect.height;

}


function drawTI(){

    const width =
        tiCanvas.width;

    const height =
        tiCanvas.height;


    /* DARK BACKGROUND */

    tiCtx.fillStyle = "#111";

    tiCtx.fillRect(
        0,
        0,
        width,
        height
    );


    const pixelSize = 4;


    /* GRAIN */

    for(
        let y = 0;
        y < height;
        y += pixelSize
    ){

        for(
            let x = 0;
            x < width;
            x += pixelSize
        ){

            const gradient =
                (x / width
                + y / height)
                / 2;

            const noise =
                Math.random() * 45;

            const brightness =
                Math.floor(
                    10
                    + gradient * 35
                    + noise
                );

            tiCtx.fillStyle =
                `rgb(${brightness}, ${brightness}, ${brightness})`;

            tiCtx.fillRect(
                x,
                y,
                pixelSize,
                pixelSize
            );

        }

    }


    /* WHITE PIXELATED DOT */

    const dotX =
        width * 0.53;

    const dotY =
        height * 0.48;


    const dotPixels = [

                  [0, -3], [1, -3],

        [-1, -2], [0, -2], [1, -2], [2, -2],

        [-1, -1], [0, -1], [1, -1], [2, -1],

                  [0,  0], [1,  0]

    ];


    const dotPixelSize = 3;

    tiCtx.fillStyle = "#ffffff";


    for(
        const [px, py]
        of dotPixels
    ){

        tiCtx.fillRect(
            dotX
            + px * dotPixelSize,

            dotY
            + py * dotPixelSize,

            dotPixelSize,
            dotPixelSize
        );

    }

}


/* ANIMATE QPR-001TI */

let lastTIUpdate = 0;

const TI_UPDATE_SPEED = 60;


function animateTI(timestamp){

    if(
        timestamp - lastTIUpdate
        >= TI_UPDATE_SPEED
    ){

        drawTI();

        lastTIUpdate =
            timestamp;

    }

    requestAnimationFrame(animateTI);

}


resizeTICanvas();


window.addEventListener(
    "resize",
    function(){

        resizeTICanvas();

        drawTI();

    }
);


requestAnimationFrame(animateTI);

</script>

</body>

</html>
