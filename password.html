<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Password Required</title>

<style>

body{

background:#000;
color:#00ff00;

font-family:Consolas, monospace;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

margin:0;

}

.container{

text-align:center;

}

h1{

font-weight:normal;

margin-bottom:30px;

}

input{

width:380px;

padding:15px;

background:black;

border:2px solid lime;

color:lime;

font-size:22px;

font-family:Consolas;

outline:none;

}

#error{

margin-top:20px;

color:red;

height:25px;

}

</style>

</head>

<body>

<div class="container">

<h1>Please insert Password</h1>

<input
type="password"
id="password"
autocomplete="off">

<div id="error"></div>

</div>

<script>

function check(){

let pass=document.getElementById("password").value;

if(pass==="PH7012QPR"){

window.location="loading.html";

}

else{

document.getElementById("error").innerHTML="ACCESS DENIED";

}

}

document.getElementById("password").addEventListener("keydown",function(e){

if(e.key==="Enter"){

check();

}

});

</script>

</body>

</html>
